amcl:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    map_topic: map
    first_map_only: true
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.12
    laser_max_range: 12.0
    max_beams: 90
    update_min_d: 0.10
    update_min_a: 0.10
    transform_tolerance: 0.30

planner_server:
  ros__parameters:
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      use_astar: true
      allow_unknown: false
      tolerance: 0.15

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    enable_stamped_cmd_vel: true
    odom_topic: odom
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.20
      movement_time_allowance: 12.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.16
      yaw_goal_tolerance: 0.12
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.60
      lookahead_dist: 0.55
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.80
      rotate_to_heading_min_angle: 0.60
      max_angular_accel: 1.50
      approach_velocity_scaling_dist: 0.70
      max_allowed_time_to_collision_up_to_carrot: 1.0
      inflation_cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      update_frequency: 8.0
      publish_frequency: 4.0
      footprint: "[[0.24, 0.23], [0.24, -0.23], [-0.24, -0.23], [-0.24, 0.23]]"
      footprint_padding: 0.02
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: scan
          data_type: LaserScan
          marking: true
          clearing: true
          raytrace_max_range: 4.5
          obstacle_max_range: 3.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      update_frequency: 2.0
      publish_frequency: 1.0
      track_unknown_space: true
      footprint: "[[0.24, 0.23], [0.24, -0.23], [-0.24, -0.23], [-0.24, 0.23]]"
      footprint_padding: 0.02
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    robot_base_frame: base_footprint
    local_frame: odom
    global_frame: map
    max_rotational_vel: 0.80
    rotational_acc_lim: 1.50
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity: [0.60, 0.0, 1.0]
    min_velocity: [-0.25, 0.0, -1.0]
    max_accel: [0.60, 0.0, 1.50]
    max_decel: [-0.60, 0.0, -1.50]
    velocity_timeout: 0.5

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    source_timeout: 0.5
    polygons: [footprint_approach]
    footprint_approach:
      type: polygon
      action_type: approach
      footprint_topic: local_costmap/published_footprint
      time_before_collision: 0.8
      min_points: 4
    observation_sources: [scan]
    scan:
      type: scan
      topic: scan
      min_height: 0.10
      max_height: 1.0

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    error_code_names: [compute_path_error_code, follow_path_error_code]
